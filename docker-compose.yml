services:
  db:
    image: postgres:16-alpine
    container_name: baraholka_db
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - baraholka-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-baraholka-backend:local}
    build: .
    container_name: backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - baraholka_static:/app/staticfiles
    networks:
      - baraholka-net
    healthcheck:
      test: ["CMD", "python", "manage.py", "health_check", "health_check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  baraholka_static:
    external: true

networks:
  baraholka-net:
    external: true